name: Build, Push & Deploy to Production

on:
  push:
    branches: [ main ]

env:
  REGISTRY: localhost:5000
  IMAGE_NAME: devops-assessment-app
  APP_VERSION: "1.0.0"

jobs:
  build-and-push:
    name: Build & Push to Local Registry
    runs-on: self-hosted
    outputs:
      image_tag: ${{ steps.meta.outputs.version }}
      full_image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker

      - name: Extract Docker metadata (SHA & SemVer tags)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=${{ env.APP_VERSION }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy-and-verify:
    name: Deploy with Smoke Test & Auto-Rollback
    needs: build-and-push
    runs-on: self-hosted
    steps:
      - name: Deploy Locally with Health Check & Rollback
        run: |
          set -e
          IMAGE="${{ needs.build-and-push.outputs.full_image }}"
          NEW_TAG="${{ needs.build-and-push.outputs.image_tag }}"
          CONTAINER_NAME="devops-web-app"

          # Save currently running image tag for rollback
          PREV_IMAGE=$(docker inspect --format='{{.Config.Image}}' $CONTAINER_NAME 2>/dev/null || echo "")
          echo "Previous image: ${PREV_IMAGE:-none}"
          echo "Deploying new image: ${IMAGE}:${NEW_TAG}"

          docker pull "${IMAGE}:${NEW_TAG}"
          docker stop $CONTAINER_NAME 2>/dev/null || true
          docker rm $CONTAINER_NAME 2>/dev/null || true

          docker run -d \
            --name $CONTAINER_NAME \
            --restart unless-stopped \
            -p 8080:8080 \
            -e APP_ENV=production \
            -e APP_VERSION="${{ env.APP_VERSION }}" \
            "${IMAGE}:${NEW_TAG}"

          # আপনার দেওয়া স্মোক টেস্ট কোডটি এখানে যুক্ত করা হয়েছে
          echo "Waiting for container to initialize..."
          sleep 3  # কন্টেইনার পুরোপুরি রুট রেডি হওয়ার জন্য ৩ সেকেন্ড সময় দেওয়া হলো

          MAX_ATTEMPTS=15
          RETRY_DELAY=2
          SUCCESS=false

          for ((i=1; i<=MAX_ATTEMPTS; i++)); do
              # সরাসরি পোর্টের সঠিক ইউআরএল (port 8080) চেক করা হচ্ছে এবং HTTP Status Code নেওয়া হচ্ছে
              HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/health)

              if [ "$HTTP_STATUS" -eq 200 ]; then
                  echo "Attempt $i: Health check PASSED! (Status 200 received)"
                  SUCCESS=true
                  break
              else
                  echo "Attempt $i: Health check not ready yet (Status: $HTTP_STATUS), retrying in $RETRY_DELAY seconds..."
                  sleep $RETRY_DELAY
              fi
          done

          # যদি ১৫ বারের মধ্যেও পাস না করে, তবে রুলব্যাক ট্রিগার করবে
          if [ "$SUCCESS" = false ]; then
              echo "Smoke test FAILED! Printing container logs for debugging:"
              docker logs $CONTAINER_NAME || true

              echo "Initiating automatic rollback..."
              docker stop $CONTAINER_NAME 2>/dev/null || true
              docker rm $CONTAINER_NAME 2>/dev/null || true
              if [ -n "$PREV_IMAGE" ]; then
                docker run -d \
                  --name $CONTAINER_NAME \
                  --restart unless-stopped \
                  -p 8080:8080 \
                  "$PREV_IMAGE"
                echo "Rolled back to $PREV_IMAGE"
              fi
              exit 1
          fi

          echo "Smoke test completed successfully!"
