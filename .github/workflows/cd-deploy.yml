name: Build, Push & Deploy to Production

on:
  push:
    branches: [ main ]

env:
  REGISTRY: localhost:5000
  IMAGE_NAME: devops-assessment-app
  APP_VERSION: "1.0.0"

jobs:
  build-and-push:
    name: Build & Push to Local Registry
    runs-on: self-hosted
    outputs:
      image_tag: ${{ steps.meta.outputs.version }}
      full_image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker

      - name: Extract Docker metadata (SHA & SemVer tags)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=${{ env.APP_VERSION }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy-and-verify:
    name: Deploy with Smoke Test & Auto-Rollback
    needs: build-and-push
    runs-on: self-hosted
    steps:
      - name: Deploy Locally with Health Check & Rollback
        run: |
          set -e
          IMAGE="${{ needs.build-and-push.outputs.full_image }}"
          NEW_TAG="${{ needs.build-and-push.outputs.image_tag }}"
          CONTAINER_NAME="devops-web-app"

          # Save currently running image tag for rollback
          PREV_IMAGE=$(docker inspect --format='{{.Config.Image}}' $CONTAINER_NAME 2>/dev/null || echo "")
          echo "Previous image: ${PREV_IMAGE:-none}"
          echo "Deploying new image: ${IMAGE}:${NEW_TAG}"

          docker pull "${IMAGE}:${NEW_TAG}"
          docker stop $CONTAINER_NAME 2>/dev/null || true
          docker rm $CONTAINER_NAME 2>/dev/null || true

          docker run -d \
            --name $CONTAINER_NAME \
            --restart unless-stopped \
            -p 8080:8080 \
            -e APP_ENV=production \
            -e APP_VERSION="${{ env.APP_VERSION }}" \
            "${IMAGE}:${NEW_TAG}"

          # Wait 5 seconds for the application to initialize
          echo "Waiting for container to initialize..."
          sleep 5

          # Get Container IP Address directly to avoid localhost routing issues
          CONTAINER_IP=$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' $CONTAINER_NAME)
          echo "Container IP: $CONTAINER_IP"

          # Smoke Test against Container IP directly with extended retries
          echo "Running smoke test..."
          HEALTHY=false
          for i in {1..15}; do
            if curl -sf http://$CONTAINER_IP:8080/health | grep -q "healthy"; then
              HEALTHY=true
              break
            fi
            echo "Attempt $i: Health check not ready yet, retrying in 2 seconds..."
            sleep 2
          done

          if [ "$HEALTHY" = true ]; then
            echo "Smoke test passed! Deployment successful."
          else
            echo "Smoke test FAILED! Printing container logs for debugging:"
            docker logs $CONTAINER_NAME || true

            echo "Initiating automatic rollback..."
            docker stop $CONTAINER_NAME 2>/dev/null || true
            docker rm $CONTAINER_NAME 2>/dev/null || true
            if [ -n "$PREV_IMAGE" ]; then
              docker run -d \
                --name $CONTAINER_NAME \
                --restart unless-stopped \
                -p 8080:8080 \
                "$PREV_IMAGE"
              echo "Rolled back to $PREV_IMAGE"
            fi
            exit 1
          fi
